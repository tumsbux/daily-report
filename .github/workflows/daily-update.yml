name: Daily Dashboard Update

on:
  # Multi-cron strategy: ยิงทุก 30 นาที ตั้งแต่ 00:30 UTC (07:30 BKK) ถึง 02:30 UTC (09:30 BKK)
  # เหตุผล: data จริงเข้า fact_sales / fact_returns ตอน 07:00 BKK — รัน cron ก่อนหน้านั้นได้ data เก่า ไม่มีประโยชน์
  # เป้าหมาย: 08:30 BKK เป็น primary, slot อื่นเป็น fallback ถ้า GH Actions delay
  # Skip-guard ทำให้รอบที่ commit สำเร็จเป็นรอบแรก รอบที่เหลือ skip อัตโนมัติ
  schedule:
    - cron: '30 0 * * *'    # target 07:30 BKK (30 min หลัง data ready)
    - cron: '0 1 * * *'     # target 08:00 BKK
    - cron: '30 1 * * *'    # target 08:30 BKK (primary target)
    - cron: '0 2 * * *'     # target 09:00 BKK (fallback)
    - cron: '30 2 * * *'    # target 09:30 BKK (fallback)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ป้องกัน race condition ถ้า 2 รอบยิงทับกัน
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 20  # need history for "already-ran-today" check

      - name: Skip if already ran today (Bangkok time)
        id: guard
        # Manual trigger (workflow_dispatch) ALWAYS bypasses guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          TODAY_BKK=$(TZ='Asia/Bangkok' date +%Y-%m-%d)
          echo "Today (BKK): $TODAY_BKK"
          # หา commit message ที่ขึ้นต้นด้วย "auto:" และวันที่ committer (BKK) = วันนี้
          FOUND=$(git log --since="${TODAY_BKK} 00:00 +0700" --until="${TODAY_BKK} 23:59 +0700" \
                  --grep='^auto:' --pretty=format:'%h %ci %s' | head -1)
          if [ -n "$FOUND" ]; then
            echo "✅ Already ran today: $FOUND"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "▶️ No auto commit today yet — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install mysql-connector-python pandas openpyxl

      - name: Create db_config.json from secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
          import json, os
          cfg = {
              'host':         os.environ['DB_HOST'],
              'port':         int(os.environ.get('DB_PORT', '3306')),
              'user':         os.environ['DB_USER'],
              'password':     os.environ['DB_PASSWORD'],
              'database':     os.environ['DB_DATABASE'],
              'github_token': os.environ['GH_PAT'],
              'github_repo':  os.environ.get('GH_REPO', 'tumsbux/daily-report')
          }
          json.dump(cfg, open('db_config.json', 'w'))
          print('db_config.json created')
          "

      - name: Rebuild fraud analysis
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python rebuild_fraud_analysis.py --no-push

      - name: Build product data
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python build_