name: Daily Dashboard Update

on:
  # Multi-cron strategy: ยิงทุก 30 นาที ตั้งแต่ 00:30 UTC (07:30 BKK) ถึง 02:30 UTC (09:30 BKK)
  # เหตุผล: data จริงเข้า fact_sales / fact_returns ตอน 07:00 BKK — รัน cron ก่อนหน้านั้นได้ data เก่า ไม่มีประโยชน์
  # เป้าหมาย: 08:30 BKK เป็น primary, slot อื่นเป็น fallback ถ้า GH Actions delay
  # Skip-guard ทำให้รอบที่ commit สำเร็จเป็นรอบแรก รอบที่เหลือ skip อัตโนมัติ
  schedule:
    - cron: '30 1 * * *'    # target 08:30 BKK (primary — single slot, skip-guard handles dedup)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ป้องกัน race condition ถ้า 2 รอบยิงทับกัน
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 20  # need history for "already-ran-today" check

      - name: Skip if already ran today (Bangkok time)
        id: guard
        # Manual trigger (workflow_dispatch) ALWAYS bypasses guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          TODAY_BKK=$(TZ='Asia/Bangkok' date +%Y-%m-%d)
          echo "Today (BKK): $TODAY_BKK"
          # หา commit message ที่ขึ้นต้นด้วย "auto:" และวันที่ committer (BKK) = วันนี้
          FOUND=$(git log --since="${TODAY_BKK} 00:00 +0700" --until="${TODAY_BKK} 23:59 +0700" \
                  --grep='^auto:' --pretty=format:'%h %ci %s' | head -1)
          if [ -n "$FOUND" ]; then
            echo "✅ Already ran today: $FOUND"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "▶️ No auto commit today yet — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install mysql-connector-python pandas openpyxl pyarrow

      - name: Create db_config.json from secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
          import json, os
          cfg = {
              'host':         os.environ['DB_HOST'],
              'port':         int(os.environ.get('DB_PORT', '3306')),
              'user':         os.environ['DB_USER'],
              'password':     os.environ['DB_PASSWORD'],
              'database':     os.environ['DB_DATABASE'],
              'github_token': os.environ['GH_PAT'],
              'github_repo':  os.environ.get('GH_REPO', 'tumsbux/daily-report')
          }
          json.dump(cfg, open('db_config.json', 'w'))
          print('db_config.json created')
          "

      - name: Restore cache from orphan cache branch
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          if git fetch origin cache --depth 1; then
            git checkout origin/cache -- cache/ && echo "cache/ restored from origin/cache" || echo "WARN: cache branch has no cache/ dir"
            ls -la cache/ || true
          else
            echo "no cache branch yet — builders will auto full-refresh"
          fi

      - name: Check if today is Sunday (Bangkok time)
        if: steps.guard.outputs.skip != 'true'
        run: |
          DAY_OF_WEEK=$(TZ='Asia/Bangkok' date +%u)
          echo "Day of week (BKK): $DAY_OF_WEEK"
          if [ "$DAY_OF_WEEK" -eq 7 ]; then
            echo "Today is Sunday! Enabling --full-refresh"
            echo "FULL_REFRESH_FLAG=--full-refresh" >> "$GITHUB_ENV"
          else
            echo "Today is not Sunday. Using incremental refresh"
            echo "FULL_REFRESH_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Rebuild fraud analysis
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python rebuild_fraud_analysis.py --no-push ${{ env.FULL_REFRESH_FLAG }}

      - name: Build product data
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python build_product_data_mysql.py --no-push ${{ env.FULL_REFRESH_FLAG }}

      - name: Build lost product data
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python build_lost_product_data.py ${{ env.FULL_REFRESH_FLAG }}

      - name: Build store discount data (store-driven price adjustments)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python build_store_discount_data.py --days 92

      - name: Push lost-Product dashboard and data to tumsbux/lost-Product repo
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f lost_product_data.json ]; then
            echo "no lost_product_data.json — skipping"
            exit 0
          fi
          SZ=$(du -m lost_product_data.json | cut -f1)
          echo "lost_product_data.json size: ${SZ} MB"
          if [ "$SZ" -gt 99 ]; then
            echo "WARN: file over 99 MB — GitHub hard limit is 100 MB"
          fi
          TMP=$(mktemp -d)
          REPO_URL="https://x-access-token:${GH_PAT}@github.com/tumsbux/lost-Product.git"
          # Try clone; if empty repo, init fresh
          if git -c core.autocrlf=false clone --depth=1 "$REPO_URL" "$TMP" 2>&1; then
            echo "cloned existing repo"
          else
            echo "clone failed — initializing fresh"
            rm -rf "$TMP"
            mkdir -p "$TMP"
            git -C "$TMP" init -b main
            git -C "$TMP" remote add origin "$REPO_URL"
            echo "# lost-Product" > "$TMP/README.md"
            echo "Generated data for tumsbux/daily-report Lost Product dashboard." >> "$TMP/README.md"
          fi
          cp lost_product_data.json "$TMP/lost_product_data.json"
          cp index_for_lost_product.html "$TMP/index.html"
          cp analytics.js "$TMP/analytics.js"
          git -C "$TMP" add lost_product_data.json index.html analytics.js README.md 2>/dev/null || true
          if git -C "$TMP" diff --cached --quiet; then
            echo "no changes vs remote — skipping push"
          else
            git -C "$TMP" -c user.email=bot@dashboard -c user.name="Dashboard Bot" \
              commit -m "auto: lost-Product dashboard and data update $(TZ=Asia/Bangkok date +%Y-%m-%d)"
            git -C "$TMP" push -u origin main
            echo "OK pushed"
          fi
          rm -rf "$TMP"

      - name: Run dashboard update
        if: steps.guard.outputs.skip != 'true'
        run: python update_dashboard.py ${{ env.FULL_REFRESH_FLAG }}

      - name: Trigger lost-Product Daily GP Analysis Rebuild
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tumsbux/lost-Product/actions/workflows/daily-update.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Push cache to orphan cache branch (force, single commit)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -d cache ] || [ -z "$(ls -A cache 2>/dev/null)" ]; then
            echo "no cache files — skipping"
            exit 0
          fi
          TMP=$(mktemp -d)
          mkdir -p "$TMP/cache"
          cp -r cache/. "$TMP/cache/"
          git -C "$TMP" init -b cache
          git -C "$TMP" add -A
          git -C "$TMP" -c user.email=bot@dashboard -c user.name="Dashboard Bot" \
            commit -m "cache: $(TZ=Asia/Bangkok date +%Y-%m-%d) (built_by: gha)"
          git -C "$TMP" push --force "https://x-access-token:${GH_PAT}@github.com/tumsbux/daily-report.git" cache:refs/heads/cache
          echo "✅ cache branch force-pushed (single commit)"
          rm -rf "$TMP"

      - name: Clean up credentials
        if: always()
        run: rm -f db_config.json
