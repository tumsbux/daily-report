name: Daily Dashboard Update

on:
  schedule:
    # 08:30 Bangkok (UTC+7) = 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mysql-connector-python pandas

      - name: Create db_config.json from secrets
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = {
              "host":         os.environ["DB_HOST"],
              "port":         int(os.environ.get("DB_PORT", "3306")),
              "user":         os.environ["DB_USER"],
              "password":     os.environ["DB_PASSWORD"],
              "database":     os.environ["DB_DATABASE"],
              "github_token": os.environ["GH_PAT"]
          }
          json.dump(cfg, open("db_config.json", "w"))
          print("db_config.json created (secrets masked in log)")
          EOF

      - name: Rebuild fraud analysis (runs first — required by update_dashboard.py)
        run: python rebuild_fraud_analysis.py --no-push

