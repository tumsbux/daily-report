        }

            color: #e74c3c;
        }

        select,
        textarea,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
        }

        input[readonly] {
            background-color: #edf2f7;
            color: #718096;
            cursor: not-allowed;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .note {
            font-size: 12px;
            color: #a0aec0;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 16px;

            font-size: 16px;
            font-weight: 600;

            font-family: 'Kanit', sans-serif;
        }

        button:disabled {
            background: #cbd5e0;
            box-shadow: none;
        }

        async function submitData() {
            const branchName = document.getElementById('branchName').value;
            const role = document.getElementById('role').value;

            if (!branchName) {
                alert("กรุณาเลือกสาขาก่อนกดส่งครับ");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "กำลังบันทึกข้อมูล...";
            btn.disabled = true;

            // --- ส่วนที่ดึงข้อมูล LINE เพิ่มเติม ---
            let lineName = "-";
            let lineUserId = "-";
            try {
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineName = profile.displayName;
                    lineUserId = profile.userId;
                }
            } catch (err) {
                console.error("Error getting profile:", err);
            }
            // ----------------------------------

            const payload = {
                branchName: branchName.toString(),
                role: role,
                lineName: lineName,      // ส่งชื่อ LINE ไป
                lineUserId: lineUserId,  // ส่ง User ID ไป
                weather: document.getElementById('weather').value,
                localEvent: document.getElementById('localEvent').value,
                agriPrice: document.getElementById('agriPrice').value,
                competitor: document.getElementById('competitor').value,
                customerBehavior: document.getElementById('customerBehavior').value,
                salesFactor: document.getElementById('salesFactor').value,
                branchActivity: document.getElementById('branchActivity').value,
                issue: document.getElementById('issue').value,
                topProduct: document.getElementById('topProduct').value,
                futureNote: document.getElementById('futureNote').value
            };

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว!");
                    liff.closeWindow();
                } else {
                    alert("❌ ข้อผิดพลาด: " + result.message);
                }
            } catch (error) {
                alert("❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
            } finally {
                btn.innerText = "ส่งรายงาน";
                btn.disabled = false;
            }
        }
