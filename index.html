<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรายงานสาขาประจำวัน</title>

    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --header-gradient: linear-gradient(135deg, #3498db 0%, #0e8a8a 100%);
            --btn-gradient: linear-gradient(135deg, #3498db 0%, #0e8a8a 100%);
            --bg-color: #eef2f3;
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: #444;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: var(--header-gradient);
            color: white;
            padding: 30px 15px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        form {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            font-size: 15px;
            color: #2c3e50;
        }

        label span {
            color: #e74c3c;
        }

        select,
        textarea,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Kanit', sans-serif;
            background-color: var(--input-bg);
            transition: all 0.3s ease;
        }

        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        input[readonly] {
            background-color: #edf2f7;
            color: #718096;
            cursor: not-allowed;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .note {
            font-size: 12px;
            color: #a0aec0;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #cbd5e0;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>รายงานยอดขายประจำวัน</h2>
            <p>ระบบบันทึกรายงานเหตุการณ์สาขา</p>
        </div>

        <form id="reportForm">
            <div class="form-group">
                <label>ชื่อผู้บันทึก (LINE):</label>
                <input type="text" id="lineDisplayName" readonly placeholder="กำลังดึงข้อมูลโปรไฟล์...">
            </div>

            <div class="form-group">
                <label>รหัสและชื่อสาขา <span>*</span> :</label>
                <select id="branchName" required>
                    <option value="" disabled selected>-- เลือกสาขา --</option>
                    <option value="001 บ้านส้อง">001 บ้านส้อง</option>
                    <option value="002 พระแสง">002 พระแสง</option>
                    <!-- ... เพิ่มสาขาอื่นๆ ตามเดิมของคุณ ... -->
                    <option value="237 ปะทิว">237 ปะทิว</option>
                </select>
            </div>

            <div class="form-group">
                <label>ตำแหน่ง <span>*</span> :</label>
                <select id="role" required>
                    <option value="SM">SM</option>
                    <option value="DM">DM</option>
                    <option value="RM">RM</option>
                    <option value="RD">RD</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>สภาพอากาศ :</label>
                <select id="weather">
                    <option value="แดดจัด">แดดจัด</option>
                    <option value="ฝนตกหนัก">ฝนตกหนัก</option>
                    <option value="ฟ้าครึ้ม">ฟ้าครึ้ม</option>
                </select>
            </div>

            <div class="form-group">
                <label>1. เหตุการณ์ในพื้นที่ :</label>
                <div class="note">เช่น งานเทศกาล, ซ่อมถนน</div>
                <textarea id="localEvent" placeholder="ระบุเหตุการณ์สำคัญ..."></textarea>
            </div>

            <!-- ... ช่องกรอกอื่นๆ 2-8 ... -->

            <div class="form-group">
                <label>9. บันทึกเพื่ออนาคต (ปีหน้า) :</label>
                <textarea id="futureNote" placeholder="ระบุข้อเสนอแนะ..."></textarea>
            </div>

            <button type="button" id="submitBtn" onclick="submitData()">ส่งข้อมูลรายงาน</button>
        </form>
    </div>

    <script>
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwlrgZS-4HhnHIgLxIcrS3s0Z8xdoDiNxVSs7uLanCWgX3jFAzun8G4HbQ2wON1oR-vnA/exec";
        let lineName = "-";
        let lineUserId = "-";

        async function initializeLiff() {
            try {
                await liff.init({ liffId: "2009937829-1ooSTxeX" });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    lineName = profile.displayName;
                    lineUserId = profile.userId;
                    document.getElementById('lineDisplayName').value = lineName;
                }
            } catch (err) {
                console.error('LIFF Error:', err);
            }
        }
        initializeLiff();

        async function submitData() {
            const branch = document.getElementById('branchName').value;
            if (!branch) return alert("กรุณาเลือกสาขา");

            const btn = document.getElementById('submitBtn');
            btn.innerText = "กำลังบันทึกข้อมูล...";
            btn.disabled = true;

            const payload = {
                branchName: branch,
                role: document.getElementById('role').value,
                lineName: lineName,
                lineUserId: lineUserId,
                weather: document.getElementById('weather').value,
                localEvent: document.getElementById('localEvent').value,
                futureNote: document.getElementById('futureNote').value
                // เพิ่มฟิลด์อื่นๆ (2-8) ให้ครบตาม ID ที่ตั้งไว้
            };

            try {
                const res = await fetch(GOOGLE_WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    alert("✅ บันทึกสำเร็จ!");
                    liff.closeWindow();
                }
            } catch (e) {
                alert("❌ เกิดข้อผิดพลาด");
            } finally {
                btn.innerText = "ส่งข้อมูลรายงาน";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
